services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: agent-sandbox-platform:e2e
    pull_policy: never
    cpus: ${BENCHMARK_API_CPUS:-2.0}
    mem_limit: ${BENCHMARK_API_MEMORY:-2g}
    environment:
      MASTER_API_KEY: ${MASTER_API_KEY:?Set MASTER_API_KEY for the E2E stack}
      TENANT_QUOTA_ENABLED: ${TENANT_QUOTA_ENABLED:-true}
      TENANT_MAX_CONCURRENT_EXECUTIONS: ${TENANT_MAX_CONCURRENT_EXECUTIONS:-4}
      TENANT_DAILY_EXECUTION_LIMIT: ${TENANT_DAILY_EXECUTION_LIMIT:-10000}
      TENANT_DAILY_EXECUTION_SECONDS: ${TENANT_DAILY_EXECUTION_SECONDS:-86400}
      SANDBOX_POOL_ENABLED: ${SANDBOX_POOL_ENABLED:-true}
      SANDBOX_POOL_PY: ${SANDBOX_POOL_PY:-2}
      SANDBOX_POOL_PARALLEL_BATCH: ${SANDBOX_POOL_PARALLEL_BATCH:-1}
      SANDBOX_POOL_REPLENISH_INTERVAL: ${SANDBOX_POOL_REPLENISH_INTERVAL:-2}
      SANDBOX_POOL_EXHAUSTION_TRIGGER: ${SANDBOX_POOL_EXHAUSTION_TRIGGER:-true}
      SANDBOX_POOL_ADAPTIVE_ENABLED: ${SANDBOX_POOL_ADAPTIVE_ENABLED:-false}
      SANDBOX_POOL_ADAPTIVE_MAX_SIZE: ${SANDBOX_POOL_ADAPTIVE_MAX_SIZE:-8}
      SANDBOX_POOL_ADAPTIVE_MISS_WINDOW_SECONDS: ${SANDBOX_POOL_ADAPTIVE_MISS_WINDOW_SECONDS:-30}
      SANDBOX_POOL_REPLENISH_MAX_ACTIVE: ${SANDBOX_POOL_REPLENISH_MAX_ACTIVE:-1}

